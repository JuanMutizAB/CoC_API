<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoC - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="AskBlue">
      <img
        class="brand-panel-logo"
        src="askblue-logo-oficial-rgb.png"
        alt="AskBlue"
      >
      <h2 class="brand-slogan">
        <span>Where <strong>business</strong></span>
        <span>meets <strong>Technology</strong></span>
      </h2>
    </section>

    <section class="login-card" aria-labelledby="login-title">
      <div class="brand" aria-label="AskBlue - Cockpit of Communications">
        <img
          class="brand-logo"
          src="askblue-logo-oficial-rgb.png"
          alt="AskBlue"
        >
        <p class="brand-name">Cockpit of Communications</p>
      </div>

      <h1 id="login-title">Login</h1>
      <p class="subtitle">Input your credentials to access the cockpit</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="body@example.com"
            autocomplete="email"
            required
          >
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <div class="password-label-row">
            <label for="password">Password</label>
          </div>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            >
            <button
              class="password-toggle"
              type="button"
              aria-label="Mostrar palavra-passe"
              aria-pressed="false"
            >
              <svg class="eye-icon eye-icon-hidden" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 4.24A10.8 10.8 0 0112 4c5.5 0 9.5 5 9.5 8a7.9 7.9 0 01-2.1 3.6M6.2 6.2C3.9 7.7 2.5 10 2.5 12c0 3 4 8 9.5 8a9.7 9.7 0 004.1-.9"></path>
              </svg>
              <svg class="eye-icon eye-icon-visible" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12c0-3 4-8 9.5-8s9.5 5 9.5 8-4 8-9.5 8-9.5-5-9.5-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="forgot-password">
            Forgot your credentials?
            <a href="https://tblue.askblue.pt/Account/Login?ReturnUrl=%2F" target="_blank" rel="noopener noreferrer">Open a ticket on TBlue</a>
          </span>
          <span class="error-message" id="password-error"></span>
        </div>

        <button class="login-button" type="submit">Login</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>

      <p class="signup-text">
        Don't have an account?
        <a href="https://tblue.askblue.pt/Account/Login?ReturnUrl=%2F" target="_blank" rel="noopener noreferrer">Open a ticket on TBlue</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
