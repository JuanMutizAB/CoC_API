<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CoC</title>
  <link rel="stylesheet" href="create-account.css">
</head>
<body>
  <main class="create-account-page">
    <header class="page-header">
      <a class="brand" href="../LogInPage/index.html" aria-label="Cockpit of Communications - Login">
        <img src="../askblue-logo-oficial-rgb.png" alt="AskBlue">
        <span class="brand-copy">
          <span class="brand-name">Cockpit of Communications</span>
          <span class="page-title">Create Account</span>
        </span>
      </a>
    </header>

    <section class="create-account-card" aria-labelledby="create-account-title">
      <div class="toolbar">
        <button class="back-button" id="back-to-accounts" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m7 7-7-7 7-7"></path>
          </svg>
          <span>Back to accounts</span>
        </button>
      </div>

      <div class="section-heading">
        <div>
          <h1 id="create-account-title">Create Account</h1>
          <p id="create-account-subtitle">Enter details to add a new account to your organization</p>
        </div>
        <span class="demo-badge">Demo data</span>
      </div>

      <form id="create-account-form" class="create-account-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="user-name">Name</label>
            <input
              id="user-name"
              type="text"
              placeholder="First and last name"
              autocomplete="name"
              required
            >
            <span class="error-message" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="user-email">Email</label>
            <input
              id="user-email"
              type="email"
              placeholder="user@example.com"
              autocomplete="email"
              required
            >
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="user-birthdate">Birth date</label>
            <input
              id="user-birthdate"
              type="date"
              title="Click the calendar icon to select your birth date"
              required
            >
            <span class="error-message" id="birthdate-error"></span>
          </div>

          <div class="form-group">
            <label for="user-taxid">Tax ID</label>
            <input
              id="user-taxid"
              type="text"
              placeholder="9 digits (e.g. 123456789)"
              maxlength="9"
              inputmode="numeric"
              required
            >
            <span class="error-message" id="taxid-error"></span>
          </div>

          <div class="form-group form-group--full">
            <label for="user-password">Password</label>
            <div class="password-field">
              <input
                id="user-password"
                type="password"
                placeholder="Your password"
                autocomplete="new-password"
                required
              >
              <button
                class="password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="eye-icon eye-icon-hidden" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 4.24A10.8 10.8 0 0112 4c5.5 0 9.5 5 9.5 8a7.9 7.9 0 01-2.1 3.6M6.2 6.2C3.9 7.7 2.5 10 2.5 12c0 3 4 8 9.5 8a9.7 9.7 0 004.1-.9"></path>
                </svg>
                <svg class="eye-icon eye-icon-visible" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12c0-3 4-8 9.5-8s9.5 5 9.5 8-4 8-9.5 8-9.5-5-9.5-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <span class="field-hint">Must be more than 8 characters, with uppercase, lowercase, digit and symbol.</span>
            <span class="error-message" id="password-error"></span>
          </div>
        </div>

        <div class="roles-section">
          <span class="roles-title">Roles &amp; Characteristics</span>
          <div class="characteristics-grid">
            <label class="characteristic-toggle">
              <input type="checkbox" id="role-admin" value="Admin">
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="characteristic-label">Admin</span>
            </label>

            <label class="characteristic-toggle">
              <input type="checkbox" id="role-aprovando" value="isAprovando">
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="characteristic-label">Aprovando</span>
            </label>

            <label class="characteristic-toggle">
              <input type="checkbox" id="role-aprovador" value="isAprovador">
              <span class="checkbox-mark" aria-hidden="true"></span>
              <span class="characteristic-label">Aprovador</span>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button class="primary-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span>Create Account</span>
          </button>
          <button class="cancel-button" id="cancel-create" type="button">Clear</button>
        </div>

        <p class="action-message" id="action-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="create-account.js"></script>
</body>
</html>
