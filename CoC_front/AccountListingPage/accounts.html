<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Management - CoC</title>
  <link rel="stylesheet" href="accounts.css">
</head>
<body>
  <main class="accounts-page">
    <header class="page-header">
      <a class="brand" href="../LogInPage/index.html" aria-label="Cockpit of Communications - Login">
        <img src="../askblue-logo-oficial-rgb.png" alt="AskBlue">
        <span class="brand-copy">
          <span class="brand-name">Cockpit of Communications</span>
          <span class="page-title">Account Management</span>
        </span>
      </a>
    </header>

    <section class="accounts-card" aria-labelledby="accounts-title">
      <div class="toolbar">
        <label class="search-field">
          <span class="visually-hidden">Search accounts</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"></circle>
            <path d="m16 16 4.5 4.5"></path>
          </svg>
          <input id="account-search" type="search" placeholder="Search" autocomplete="off">
        </label>

        <label class="deleted-toggle">
          <input id="show-inactive" type="checkbox">
          <span class="checkbox-mark" aria-hidden="true"></span>
          <span>Show inactive</span>
        </label>

        <button class="primary-button" id="create-account" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span>Create Account</span>
        </button>

        <button class="back-button" id="back-to-campaigns" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m7 7-7-7 7-7"></path>
          </svg>
          <span>Back to campaigns</span>
        </button>
      </div>

      <div class="section-heading">
        <div>
          <h1 id="accounts-title">Accounts</h1>
          <p>Manage the accounts in your organization.</p>
        </div>
        <span class="demo-badge">Demo data</span>
      </div>

      <div class="table-wrap">
        <table class="accounts-table">
          <thead>
            <tr>
              <th id="name-heading" scope="col" aria-sort="ascending">
                <button class="sort-button" type="button" data-sort="name">
                  Name <span class="sort-indicator" aria-hidden="true">↑</span>
                </button>
              </th>
              <th id="birthdate-heading" scope="col" aria-sort="none">
                <button class="sort-button" type="button" data-sort="birthDate">
                  Birth date <span class="sort-indicator" aria-hidden="true">↕</span>
                </button>
              </th>
              <th scope="col">Email</th>
              <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="accounts-list"></tbody>
        </table>
      </div>

      <div class="table-footer">
        <p id="results-count" role="status" aria-live="polite"></p>
      </div>
      <p class="action-message" id="action-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="accounts.js"></script>
</body>
</html>
