<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Campaign - CoC</title>
    <link rel="stylesheet" href="edit_Campaing.css">
</head>
<body>
    <main class="edit-campaign-page">
        <header class="page-header">
            <a class="brand" href="index.html" aria-label="Cockpit of Communications - Login">
                <img src="../askblue-logo-oficial-rgb.png" alt="AskBlue">
                <span class="brand-copy">
                    <span class="brand-name">Cockpit of Communications</span>
                    <span class="page-title">Campaigns</span>
                </span>
            </a>
        </header>

        <section class="edit-campaign-card" aria-labelledby="edit-campaign-title">
            <div class="section-heading">
                <div>
                    <h1 id="edit-campaign-title">Edit Campaign</h1>
                    <p>Update the campaign details, content, image, and schedule.</p>
                </div>
                <a class="back-button" href="../feedback/feedBack.html">Campaign Feedback</a>
            </div>

            <form id="campaign-form" class="campaign-form">
                <div class="form-grid">
                    <div class="form-field form-field--full">
                        <label for="campaign-name">Campaign Name</label>
                        <input type="text" id="campaign-name" name="name" placeholder="e.g. Summer Campaign" required>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-description">Description</label>
                        <textarea id="campaign-description" name="description" rows="3" placeholder="Briefly describe the campaign goal"></textarea>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-text">Campaign Text</label>
                        <textarea id="campaign-text" name="text" rows="5" placeholder="Write the text to be published"></textarea>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-image">Campaign Image</label>
                        <input class="file-input" type="file" id="campaign-image" name="image" accept="image/*" required>
                        <span class="field-hint">Choose an image from your device.</span>
                    </div>

                    <div class="form-field">
                        <label for="campaign-publish-date">Publish Date</label>
                        <input type="date" id="campaign-publish-date" name="publishDate" required>
                    </div>

                    <div class="form-field">
                        <label for="campaign-publish-time">Publish Time</label>
                        <input
                            type="text"
                            id="campaign-publish-time"
                            name="publisTime"
                            inputmode="numeric"
                            maxlength="5"
                            pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
                            placeholder="HH:mm"
                            aria-describedby="publish-time-hint"
                            required
                        >
                        <span class="field-hint" id="publish-time-hint">Formato de 24 horas, por exemplo 14:30.</span>
                    </div>
                </div>

                <div class="form-actions">
                    <p id="form-status" role="status" aria-live="polite"></p>
                    <button class="primary-button" type="submit" id="submit-campaign">
                        <span>Save Campaign</span>
                    </button>
                </div>
            </form>
        </section>
    </main>
    <script src="edit_campaing.js" defer></script>
</body>
</html>
