<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskBlue</title>
    <link rel="stylesheet" href="edit_Campaing.css">
</head>
<body>
    <div class="page-shell">
        <!-- mudar para campaing list -->
        <a href="Feedback.html">Adicionar feedback</a>
        <header class="topbar">
            <a class="brand" href="#" aria-label="AskBlue - início">AskBlue</a>
        </header>

        <main class="edit-campaign">
            <section class="card-heading">
                <p class="eyebrow">Campanhas <span>/</span> Nova campanha</p>
                <h1>Editar campanha</h1>
                <p class="intro">Adicione os detalhes, a imagem e a data de publicação.</p>
            </section>

            <form id="campaign-form" class="campaign-form">
                <div class="form-grid">
                    <div class="form-field form-field--full">
                        <label for="campaign-name">Nome da campanha</label>
                        <input type="text" id="campaign-name" name="name" placeholder="Ex.: Campanha de verão" required>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-description">Descrição</label>
                        <textarea id="campaign-description" name="description" rows="3" placeholder="Descreva brevemente o objetivo da campanha"></textarea>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-text">Texto da campanha</label>
                        <textarea id="campaign-text" name="text" rows="5" placeholder="Escreva o texto que será publicado"></textarea>
                    </div>

                    <div class="form-field form-field--full">
                        <label for="campaign-image">Imagem da campanha</label>
                        <input class="file-input" type="file" id="campaign-image" name="image" accept="image/*" required>
                        <span class="field-hint">Escolha uma imagem do seu dispositivo.</span>
                    </div>

                    <div class="form-field">
                        <label for="campaign-publish-date">Data de publicação</label>
                        <input type="date" id="campaign-publish-date" name="publishDate" required>
                    </div>

                    <div class="form-field">
                        <label for="campaign-publish-time">Hora de publicação</label>
                        <input type="time" id="campaign-publish-time" name="publisTime" required>
                    </div>
                </div>

                <div class="form-actions">
                    <p id="form-status" role="status" aria-live="polite"></p>
                    <button type="submit" id="submit-campaign">Criar campanha <span aria-hidden="true">→</span></button>
                </div>
            </form>
        </main>
    </div>
    <script src="app.js" defer></script>
</body>
</html>
